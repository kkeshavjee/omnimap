<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#1d4ed8"/>

  <!-- Map pin / node dot at top -->
  <circle cx="32" cy="13" r="5.5" fill="white"/>

  <!-- Stem of pin -->
  <path d="M32 18 Q28 26 24 36" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M32 18 Q36 26 40 36" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Network nodes -->
  <circle cx="18" cy="42" r="4" fill="white" opacity="0.85"/>
  <circle cx="46" cy="42" r="4" fill="white" opacity="0.85"/>
  <circle cx="32" cy="52" r="4" fill="white" opacity="0.7"/>

  <!-- Connecting lines between nodes -->
  <line x1="22" y1="42" x2="42" y2="42" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="45" x2="30" y2="50" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="44" y1="45" x2="34" y2="50" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="38" x2="28" y2="36" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="38" x2="36" y2="36" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
